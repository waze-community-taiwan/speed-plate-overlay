name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (first release uses package.json version)
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: Optional explicit stable version, e.g. 1.0.0
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve version or resume this run
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs
      - name: Validate and build the release
        if: steps.version.outputs.ready == 'true'
        run: |
          npm run typecheck
          npm test
          npm run test:release
          npm run build
          npm run verify:release
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Commit tested bundle and version, then push atomically
        if: steps.version.outputs.ready == 'true' && steps.version.outputs.resume != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cp dist/wme-speed-plate-overlay.user.js wme-speed-plate-overlay.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json wme-speed-plate-overlay.user.js
          git commit --allow-empty -m "chore(release): ${TAG}" -m "Release-Run: ${GITHUB_RUN_ID}"
          git tag -a "$TAG" -m "Release ${TAG}"
          # Never overwrite a newer push; branch and tag both succeed or neither does.
          git push --atomic origin HEAD:main "refs/tags/${TAG}"
      - name: Publish GitHub Release
        if: steps.version.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/wme-speed-plate-overlay.user.js --clobber
          else
            gh release create "$TAG" dist/wme-speed-plate-overlay.user.js --verify-tag --title "$TAG" --generate-notes
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-diagnostics
          path: |
            test-results/
            dist/
